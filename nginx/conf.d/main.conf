# Upstream блоки — балансировщики для каждого сервиса
# Локально по одному инстансу, на проде можно добавить несколько

upstream auth_service {
    server auth-service:3001;
    # На проде:
    # server auth-service-1:3001;
    # server auth-service-2:3001;
}

upstream task_service {
    server task-service:3002;
}

upstream notification_service {
    server notification-service:3003;
}

server {
    listen 80;

    # Прокидываем Request ID для трассировки между сервисами
    add_header X-Request-Id $request_id_header always;

    # Auth Service
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Task Service
    location /api/tasks/ {
        proxy_pass http://task_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification Service
    location /api/notifications/ {
        proxy_pass http://notification_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Агрегированный health check — проверяет все сервисы
    location /health {
        proxy_pass http://auth_service/health;
        access_log off;
    }
}