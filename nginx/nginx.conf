user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/conf.d/*.conf;

    # Общие настройки логирования
    log_format main '$remote_addr - $request_time '
                    '"$request" $status '
                    '"$http_x_request_id"';

    # Передаём X-Request-Id через все сервисы для трассировки
    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        ""      $request_id;
    }
}