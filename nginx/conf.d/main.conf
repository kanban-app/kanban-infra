server {
    listen 80;

    # Используем Docker DNS резолвер
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    location /api/auth/ {
        set $auth_upstream http://auth-service:3001;
        proxy_pass $auth_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;

        # Если сервис недоступен — возвращаем 503 а не падаем
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/tasks/ {
        set $task_upstream http://task-service:3002;
        proxy_pass $task_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/notifications/ {
        set $notification_upstream http://notification-service:3003;
        proxy_pass $notification_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id_header;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /health {
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
        access_log off;
    }
}