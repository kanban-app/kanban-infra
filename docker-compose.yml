name: kanban-dev

services:
  # ─────────────────────────────────────────
  # PostgreSQL — отдельный инстанс для каждого сервиса
  # ─────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: kanban-postgres-auth
    environment:
      POSTGRES_USER: kanban_auth
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: kanban_auth
    ports:
      - "5433:5432" # разные порты чтобы не конфликтовали на хосте
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./postgres/auth/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_auth -d kanban_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-task:
    image: postgres:16-alpine
    container_name: kanban-postgres-task
    environment:
      POSTGRES_USER: kanban_task
      POSTGRES_PASSWORD: ${POSTGRES_TASK_PASSWORD}
      POSTGRES_DB: kanban_task
    ports:
      - "5434:5432"
    volumes:
      - postgres_task_data:/var/lib/postgresql/data
      - ./postgres/task/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_task -d kanban_task"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: kanban-postgres-notification
    environment:
      POSTGRES_USER: kanban_notification
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD}
      POSTGRES_DB: kanban_notification
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
      - ./postgres/notification/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U kanban_notification -d kanban_notification",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — только кэш и rate limiting
  # ─────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Kafka (KRaft — без Zookeeper)
  # ─────────────────────────────────────────

  kafka:
    image: apache/kafka:3.7.0
    container_name: kanban-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # фиксированный ID для KRaft
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Kafka UI — визуальный интерфейс для просмотра топиков и сообщений
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kanban-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080" # http://localhost:8080 — UI для Kafka

  # ─────────────────────────────────────────
  # Nginx
  # ─────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: kanban-nginx
    ports:
      - "3000:80" # весь внешний трафик через порт 3000 локально
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - kafka # просто чтобы nginx стартовал последним
    # Сервисы приложений добавишь сюда когда они появятся

volumes:
  postgres_auth_data:
  postgres_task_data:
  postgres_notification_data:
  redis_data:
  kafka_data:
